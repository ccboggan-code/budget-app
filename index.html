<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Budget App</title>

  <style>
    :root {
      --bg-main: #1e1e1e;
      --bg-secondary: #252526;
      --bg-tertiary: #2d2d2d;
      --text-main: #e6e6e6;
      --text-muted: #bdbdbd;
      --border-soft: #3c3c3c;
      --accent: #4fc3f7;
      --danger: #ef5350;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    h1, h2, h3 {
      margin-bottom: 10px;
    }

    input, select, button {
      background-color: var(--bg-secondary);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      padding: 8px;
      border-radius: 4px;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background-color: var(--bg-tertiary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: var(--bg-secondary);
    }

    th, td {
      border: 1px solid var(--border-soft);
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: var(--bg-tertiary);
      color: var(--text-muted);
      font-weight: normal;
    }

    .income {
      color: #81c784;
    }

    .expense {
      color: #e57373;
    }

    .flex {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .total {
      font-weight: bold;
      margin-top: 15px;
    }

    /* =======================
   MOBILE CARD LAYOUT
======================= */

#categoryTotals {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.category-card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  padding: 12px;
}

.category-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.category-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  margin-bottom: 4px;
}

.progress-bar {
  height: 8px;
  background: var(--bg-tertiary);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 6px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
}

/* =======================
   TABS
======================= */

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
}

.tab.active {
  background: var(--accent);
  color: black;
}

/* =======================
   TAB CONTENT
======================= */

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* =======================
   MOBILE IMPROVEMENTS
======================= */

body {
  max-width: 800px;
}

table th:nth-child(3),
table td:nth-child(3) {
  text-align: center;
}

.flex input,
.flex select {
  flex: 1;
  min-width: 80px;
}

  </style>
</head>

<body>

<h1>Budget App</h1>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
  <button class="tab" onclick="switchTab('transactions')">Transactions</button>
  <button class="tab" onclick="switchTab('summary')">Summary</button>
</div>

<!-- DASHBOARD TAB -->
<div id="dashboardTab" class="tab-content active">

  <h2>Month</h2>
  <div class="flex">
    <select id="yearPicker"></select>
    <select id="monthPicker"></select>
  </div>

  <h3>Starting Balance</h3>
  <input
    type="text"
    inputmode="decimal"
    id="startingBalance"
    placeholder="$4,000.00"
  />
<h3>Add Transaction</h3>
<div class="flex">
  <input id="descriptionDash" placeholder="Description" />
  <input id="amountDash" inputmode="decimal" placeholder="$0.00" />

  <select id="typeDash">
    <option value="income">Income</option>
    <option value="expense">Expense</option>
  </select>

  <select id="categoryDash"></select>

  <button id="addBtnDash">Add</button>
</div>
  <div id="categoryTotals"></div>

</div>

<!-- TRANSACTIONS TAB -->
<div id="transactionsTab" class="tab-content">

  <h2>Add Transaction</h2>
  <div class="flex">
    <input id="description" placeholder="Description" />

    <input id="amount" inputmode="decimal" placeholder="$0.00" />

    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>

    <select id="category"></select>

    <button id="addBtn">Add</button>
  </div>

  <h2>Transactions</h2>
  <table>
    <thead>
      <tr>
        <th>Desc</th>
        <th>Cat</th>
        <th>D/C</th>
        <th>$</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="transactionTable"></tbody>
  </table>

</div>

<!-- SUMMARY TAB -->
<div id="summaryTab" class="tab-content">
  <h2>Summary</h2>
  <div id="summary"></div>
  <div id="plannedContainer"></div>

  <button id="clearAll">Clear All Data</button>
</div>

<script src="app.js"></script>

</body>
</html>
